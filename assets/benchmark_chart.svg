<svg viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Full pipeline inference time: Python PyTorch 10.4 minutes average versus C++ sana_infer 2.2 minutes average, 4.8 times faster">
  <style>
    .surface  { fill: #fcfcfb; }
    .primary  { fill: #0b0b0b; }
    .secondary{ fill: #52514e; }
    .muted    { fill: #898781; }
    .axis     { stroke: #c3c2b7; }
    .good     { fill: #006300; }
    .bar-py   { fill: #2a78d6; }
    .bar-cpp  { fill: #eb6834; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface  { fill: #1a1a19; }
      .primary  { fill: #ffffff; }
      .secondary{ fill: #c3c2b7; }
      .axis     { stroke: #383835; }
      .good     { fill: #0ca30c; }
      .bar-py   { fill: #3987e5; }
      .bar-cpp  { fill: #d95926; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="720" height="232"/>

  <text x="24" y="32" class="primary" font-size="20" font-weight="600">Full pipeline inference time</text>
  <text x="24" y="54" class="secondary" font-size="13">encode + 20 denoising steps + decode, same prompt/seed, same machine</text>

  <line class="axis" x1="180" y1="78" x2="180" y2="204" stroke-width="1"/>

  <!-- Python bar: 180 -> 620 (440px = 10.357 min) -->
  <text x="172" y="102" text-anchor="end" class="secondary" font-size="14">Python (PyTorch)</text>
  <path class="bar-py" d="M180,86 L616,86 Q620,86 620,90 L620,106 Q620,110 616,110 L180,110 Z"/>
  <text x="628" y="102" class="primary" font-size="14" font-weight="600">10.4 min</text>

  <!-- C++ bar: 180 -> 271.7 (91.7px = 2.159 min, to scale with the Python bar above) -->
  <text x="172" y="194" text-anchor="end" class="secondary" font-size="14">C++ (sana_infer)</text>
  <path class="bar-cpp" d="M180,178 L267.7,178 Q271.7,178 271.7,182 L271.7,198 Q271.7,202 267.7,202 L180,202 Z"/>
  <text x="279.7" y="194" class="primary" font-size="14" font-weight="600">2.2 min</text>
  <text x="345" y="194" class="good" font-size="14" font-weight="600">· 4.8&#215; faster</text>

  <text x="24" y="222" class="muted" font-size="11">avg of 8 timed runs (2 warmup excluded), all 10 CPU cores, Apple M1 Pro</text>
</svg>
